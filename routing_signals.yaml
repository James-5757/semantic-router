decisions:
- name: route_code
  description: Route to code model when semantic_code signal is matched
  priority: 10
  rules:
    operator: AND
    rules:
    - field: semantic_code
      operator: gte
      value: 0.72
  modelRefs:
  - model: qwen/qwen3.5-rocm
    use_reasoning: false
