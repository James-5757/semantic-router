  decisions:
  - name: route_smoke
    description: Smoke test decision
    priority: 999
    rules:
      operator: AND
      conditions:
      - type: keyword
        name: smoke_route_token
    modelRefs:
    - model: DeepSeek-V4-flash-gz
      use_reasoning: false
  - name: default-route
    description: Generated during setup to route all requests to the default model.
    priority: 1
    rules:
      operator: AND
    modelRefs:
    - model: DeepSeek-V4-flash-gz
      use_reasoning: false
  - name: route_general
    description: Route to code model when semantic_general signal is matched
    priority: 100
    rules:
      operator: AND
      conditions:
      - type: embedding
        name: semantic_general
    modelRefs:
    - model: DeepSeek-V4-flash-gz
      use_reasoning: false
  - name: route_simple_chat
    description: Route to code model when semantic_simple_chat signal is matched
    priority: 150
    rules:
      operator: AND
      conditions:
      - type: embedding
        name: semantic_simple_chat
    modelRefs:
    - model: DeepSeek-V4-flash-gz
      use_reasoning: false
  - name: route_code
    description: Route to code model when semantic_code signal is matched
    priority: 200
    rules:
      operator: AND
      conditions:
      - type: embedding
        name: semantic_code
    modelRefs:
    - model: DeepSeek-V4-flash-gz
