version: v0.3-optimized
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 300s
providers:
  defaults:
    default_model: qwen/qwen3.5-rocm
  models:
  - name: qwen/qwen3.5-rocm
    provider_model_id: qwen/qwen3.5-rocm
    backend_refs:
    - name: primary
      endpoint: vllm:8000
      protocol: http
      weight: 100
  - name: DeepSeek-V4-flash-gz
    provider_model_id: GLM-4.5-Air
    backend_refs:
    - name: endpoint-1
      endpoint: 59.37.137.190:38080
      protocol: http
      weight: 100
      base_url: http://59.37.137.190:38080/v1
      provider: openai
      auth_header: Authorization
      auth_prefix: Bearer
      chat_path: /chat/completions
      api_key: sk-df1bc672071b03358cd87b888058357d6f946311d49a3496557df4e4457fb73c
    pricing:
      currency: USD
    api_format: openai
routing:
  modelCards:
  - name: qwen/qwen3.5-rocm
    modality: text
  - name: DeepSeek-V4-flash-gz
    modality: text
  signals:
    keywords:
    - name: smoke_route_token
      operator: OR
      keywords:
      - vllm smoke route token 92741
      case_sensitive: false
      method: bm25
      bm25_threshold: 0.1
    embeddings:
    - name: semantic_code
      threshold: 0.5
      candidates:
      - Write a Python function to merge two sorted lists
      - Implement a REST API endpoint for user registration
      - Build a web scraper to extract product prices
      - Create a database migration script in SQL
      - Debug this segmentation fault in C++ code
      - 能帮我写个批量处理图片的脚本吗
      - 这段代码为什么会无限循环，帮我看看
      - 我想要一个能自动发邮件的程序
      - 帮我把这个Excel处理逻辑写成Python代码
      - 能不能给我一个解析JSON的代码示例
      - 用Python实现二叉树的中序遍历
      - 在Java中如何实现线程安全的计数器
      - 帮我写一个前端表单验证函数
      - 用SQL查出每个部门工资最高的员工
      - 实现一个缓存装饰器支持TTL过期
      - 分析这些代码的时间复杂度并给出优化建议
      - 这段代码的性能瓶颈在哪里帮我分析
      - 帮我写一份API接口文档的markdown版本
      - 把这段代码的逻辑整理成流程图
