version: v0.3
listeners:
    - name: http-8899
      address: 0.0.0.0
      port: 8899
      timeout: 300s
providers:
    defaults:
        default_model: qwen/qwen3.5-rocm
    models:
        - name: qwen/qwen3.5-rocm
          provider_model_id: qwen/qwen3.5-rocm
          backend_refs:
            - name: primary
              endpoint: vllm:8000
              protocol: http
              weight: 100
        - name: DeepSeek-V4-flash-gz
          provider_model_id: GLM-4.5-Air
          backend_refs:
            - name: endpoint-1
              endpoint: 59.37.137.190:38080
              protocol: http
              weight: 100
              base_url: http://59.37.137.190:38080/v1
              provider: openai
              auth_header: Authorization
              auth_prefix: Bearer
              chat_path: /chat/completions
              api_key: sk-df1bc672071b03358cd87b888058357d6f946311d49a3496557df4e4457fb73c
          pricing:
            currency: USD
          api_format: openai
