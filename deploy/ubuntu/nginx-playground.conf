server {
    listen 8088;
    server_name _;

    # This listener is intended for the approved internal network only.
    allow 172.20.0.0/16;
    deny all;

    # Internal staging access is IP-restricted. Basic authentication is
    # intentionally disabled during TokenCloud selector forwarding debug.

    location ^~ /v1/model-selector/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
